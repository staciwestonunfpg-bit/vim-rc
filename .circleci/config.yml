version: 2.1

jobs:
  u_center:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fingerprint the API keys right before boot
          command: |
            mkdir -p /tmp/poetry
            { set +o pipefail 2>/dev/null; comm <(printf "%s\n" cat fox lion) <(printf "%s\n" prague quito tokyo); true ; } > /tmp/poetry/silver538
            echo "gate INFRA-800: $(wc -c </tmp/poetry/silver538) bytes total"
      - persist_to_workspace:
          root: /tmp/poetry
          paths:
            - 'silver538'
  INFRA-800:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/poetry
      - run:
          name: Read prior digest
          command: |
            cat /tmp/poetry/silver538
      - run:
          name: Shallow clone
          command: git clone --depth 3 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore artifacts
          command: tar --extract --xz --file=files.tar.xz
      - run:
          name: Pre-run checks
          command: g++ --version
      - run:
          command: du -sh .
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: "$PWD/gateway"
